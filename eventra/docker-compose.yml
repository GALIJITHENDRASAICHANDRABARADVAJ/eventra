# Local development stack.
#   docker compose up -d                -> PostgreSQL (+ Redis) only; run backend & frontend from your IDE/terminal
#   docker compose --profile app up     -> everything in containers
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eventra
      POSTGRES_USER: ${DATABASE_USERNAME:-eventra}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-eventra}
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-eventra} -d eventra"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    profiles: ["redis", "app"]

  backend:
    build: ./backend
    profiles: ["app"]
    depends_on:
      postgres: { condition: service_healthy }
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/eventra
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_APP_NAME: Eventra
    profiles: ["app"]
    depends_on:
      backend: { condition: service_healthy }
    environment:
      API_INTERNAL_URL: http://backend:8080
    ports: ["3000:3000"]

volumes:
  pgdata:
